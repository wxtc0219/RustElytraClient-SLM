interact-fix:
  use-grim-expand-eye-height: false
  reach-distance: 0.0
  riding-reach-distance: 1.0
  no-cool-down: false
  cool-down-rewrite: 4
  allow-ride-interact: true
  hold-use: false
  hold-use-start-tick: 4
  client-using-state-fix: true
  gui-interact:
    enable: false
    hotkey: 'hotkey:'
    use-tick-when-screen-open: true
interaction-tweaks:
  auto-click:
    enable: false
    hotkey: 'hotkey:'
    only-when-press: true
    cooldown: 0
    left: false
    right: false
  air-place:
    enable: false
    hotkey: 'hotkey:'
    range: 5.0
    only-blocks: true
    render: false
    mode: enum:air_place_mode:VANILLA
    max-batch-place: 64
    inv-sleep-tick: 2
  no-interact:
    enable: false
    hotkey: 'hotkey:'
