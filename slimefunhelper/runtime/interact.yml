    no-interact-ignore-item: nbt:entryset:{data:[],key_type:"minecraft:item"}
    no-interact-vanilla-only: true
    auto-disable-same-tick-offhand: false
    sneak-if-may-instant: false
    auto-correct-placement: false
    auto-correct-mode: enum:legal_interact_mode:NONE
    auto-correct-air-place: false
    auto-correct-state: false
    swing-hand: true
    render-fail-interact: false
    render-fail-interact-color: nbt:wrapcolor:"#FF0000"
  auto-ride:
    enable: false
    hotkey: 'hotkey:'
    interact-cooldown: 4
  auto-eat:
    enable: false
    hotkey: 'hotkey:'
    log: true
    inv: true
    left-click-tool-force-eat: false
    left-click-weapon: true
    left-click-extra-items: nbt:entryset:{data:["minecraft:totem_of_undying"],key_type:"minecraft:item"}
    enable-health: true
    enable-hunger: true
    health-level: 10.0
    hunger-level: 16
    no-enemy: true
    no-enemy-distance-air: 8.0
    no-enemy-distance-ground: 8.0
    cooldown: 20
    white-list-item: nbt:entryset:{data:["minecraft:golden_apple","minecraft:potion","minecraft:golden_carrot"],key_type:"minecraft:item"}
    firework-fix: true
    auto-fireworks: false
    pause-in-liquid: false
    ghost-hand-mode: enum:ghost_hand_mode:INV_SWAP
    pause-for-fireworks: true
    pause-when-surround: false
    pause-when-interact: nbt:optionalprimitive:{present:0b,value:"int|2"}
    auto:
      enable: false
      hotkey: 'hotkey:'
      enable-health: true
      enable-hunger: true
      health-level: 10.0
      hunger-level: 16
      no-enemy: true
      no-enemy-distance-air: 8.0
      no-enemy-distance-ground: 8.0
      cooldown: 20
      pause-in-lava: false
    left-click-force-eat:
      enable: false
      hotkey: 'hotkey:'
      need-press-left-button: false
      enable-offhand: true
      enable-weapon: true
      enable-extra-items: nbt:entryset:{data:["minecraft:totem_of_undying"],key_type:"minecraft:item"}
  auto-use:
    enable: false
    hotkey: 'hotkey:'
    log: false
    only-when-enemy-near: false
    enemy-near-distance: 12.0
    use-food: false
    use-item-white-list: nbt:entryset:{data:["minecraft:iron_sword","minecraft:stone_sword","minecraft:golden_sword","minecraft:diamond_sword","minecraft:shield","minecraft:wooden_sword","minecraft:netherite_sword"],key_type:"minecraft:item"}
