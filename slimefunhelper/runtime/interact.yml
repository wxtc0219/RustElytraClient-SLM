      entity-priority: true
      only-interact-interactable-entity: true
      block-whitelist: nbt:entryset:{data:["minecraft:chest","minecraft:shulker_box","minecraft:trapped_chest","minecraft:ender_chest"],key_type:"minecraft:block"}
      interact-block-only-when-hand-not-block: true
