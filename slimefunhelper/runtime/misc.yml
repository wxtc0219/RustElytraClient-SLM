tem-max",value:999},{key:"widget.event-command.key.pop-totem-min",value:0},{key:"widget.event-command.key.pop-totem-max",value:999},{key:"widget.event-command.key.target-only-enemy",value:0b}],SELF_DEATH:[{key:"widget.event-command.key.totem-min",value:0},{key:"widget.event-command.key.totem-max",value:999},{key:"widget.event-command.key.pop-totem-min",value:0},{key:"widget.event-command.key.pop-totem-max",value:999}],SELF_TRIGGER_TOTEM:[{key:"widget.event-command.key.totem-min",value:0},{key:"widget.event-command.key.totem-max",value:999},{key:"widget.event-command.key.pop-totem-min",value:0},{key:"widget.event-command.key.pop-totem-max",value:999}],TICK:[{key:"widget.event-command.key.delay",value:40},{key:"widget.event-command.key.totem-min",value:0},{key:"widget.event-command.key.totem-max",value:999},{key:"widget.event-command.key.pop-totem-min",value:0},{key:"widget.event-command.key.pop-totem-max",value:999},{key:"widget.event-command.key.self-health-min",value:0.0d},{key:"widget.event-command.key.self-health-max",value:999.0d}],WORLD_CHANGE:[{key:"widget.event-command.key.totem-min",value:0},{key:"widget.event-command.key.totem-max",value:999},{key:"widget.event-command.key.self-health-min",value:0},{key:"widget.event-command.key.self-health-max",value:0}]},sample:"enum:event_command_event_type:NONE"}',default_second_primitive:'stringformat|{arguments:["player","pos","x","y","z","world","pitch","yaw","pop_cnt","target","target_x","target_y","target_z","target_pop_cnt"],format:""}',first_name:"widget.event-command.event-type",first_type:"dispatchdata",second_name:"widget.event-command.command",second_type:"stringformat"}
world-storage:
  enable-persistent-storage: true
  enable-proxy-xaeromap-storage: false
  enable-proxy-baritone-storage: false
proxy-server:
  enable: false
iq-boost:
  enable: false
  hotkey: 'hotkey:'
  boost-value: 114514
